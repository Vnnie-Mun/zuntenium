name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake libopenblas-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake openblas

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Build C++ bindings
        run: bash scripts/build_bindings.sh
        continue-on-error: true   # graceful fallback to pure-Python

      - name: Lint
        run: ruff check zuntenium/ tests/

      - name: Type check
        run: mypy zuntenium/

      - name: Run tests
        run: pytest tests/ --cov=zuntenium --cov-report=xml -x -q

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          file: coverage.xml
          flags: unittests
          name: codecov-umbrella

  lint-only:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check zuntenium/ tests/
      - run: ruff format --check zuntenium/ tests/
