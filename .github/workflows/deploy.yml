name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test verification before deploying"
        required: false
        default: false
        type: boolean
      monitoring:
        description: "Deploy Prometheus and Grafana monitoring services"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read


jobs:
  verify:
    name: Pre-Flight Verification
    runs-on: ubuntu-latest
    if: "!inputs.skip_tests"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,cloud]"
          pip install -r zuntenium_cloud/requirements.txt

      - name: Syntax & bytecode check
        run: python -m compileall -q zuntenium zuntenium_cloud

      - name: Run Cloud Platform & Worker Tests
        run: |
          pytest tests/unit/test_cloud_worker.py -v
          python -c "from zuntenium_cloud.api import app; print('✓ FastAPI App initialized:', app.title)"
          python debug_all.py

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SSH secrets configured
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          if [ -z "$DO_HOST" ] || [ -z "$DO_SSH_KEY" ]; then
            echo "::error::Required secrets DO_HOST or DO_SSH_KEY are missing in GitHub repository settings."
            echo "Please set DO_HOST (Droplet IP/domain) and DO_SSH_KEY (Private SSH Key) in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy via SSH to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: GITHUB_SHA,DEPLOY_TOKEN
          script: |
            set -euo pipefail
            APP_DIR="/opt/zuntenium"
            AUTH_REPO="https://x-access-token:${DEPLOY_TOKEN}@github.com/Vnnie-Mun/zuntenium.git"
            trap 'echo "=== DEPLOYMENT FAILED: DIAGNOSTIC CONTAINER LOGS ==="; cd "$APP_DIR" && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail 100' ERR

            echo "=== [0/5] Ensuring Docker Engine & Compose are Ready ==="
            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              echo "Installing Docker Engine..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker || true
            fi

            echo "=== [1/5] Synchronizing Repository Code ==="
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "$AUTH_REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$AUTH_REPO"
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin https://github.com/Vnnie-Mun/zuntenium.git

            echo "=== [2/5] Verifying Production Environment Configuration ==="
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Creating initial .env from template..."
              cp "$APP_DIR/.env.production.example" "$APP_DIR/.env"
              JWT_SECRET=$(openssl rand -hex 32)
              DB_PASSWORD=$(openssl rand -hex 24)
              sed -i "s|ZUNTENIUM_JWT_SECRET=\"generate-a-strong-secret-in-production-with-openssl\"|ZUNTENIUM_JWT_SECRET=\"${JWT_SECRET}\"|g" "$APP_DIR/.env"
              sed -i "s|POSTGRES_PASSWORD=\"generate-a-secure-db-password-with-openssl\"|POSTGRES_PASSWORD=\"${DB_PASSWORD}\"|g" "$APP_DIR/.env"
              chmod 600 "$APP_DIR/.env"
            fi

            echo "=== [2.5/5] Gracefully Stopping Old Containers ==="
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "=== [3/5] Building & Launching Production Containers ==="
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "=== [4/5] Awaiting Service Health Verification ==="
            API_OK=false
            for i in $(seq 1 36); do
              if curl -s -f http://127.0.0.1/health > /dev/null 2>&1; then
                echo "FastAPI REST API is healthy via reverse proxy!"
                API_OK=true
                break
              fi
              echo "Waiting for API service readiness (attempt $i/36)..."
              sleep 5
            done

            UI_OK=false
            for i in $(seq 1 36); do
              if curl -s -f http://127.0.0.1/ > /dev/null 2>&1; then
                echo "Next.js 15 UI Workspace is healthy via reverse proxy!"
                UI_OK=true
                break
              fi
              echo "Waiting for UI service readiness (attempt $i/36)..."
              sleep 5
            done

            if [ "$API_OK" != "true" ]; then
              echo "API health check failed! Container logs:"
              docker compose -f docker-compose.prod.yml logs --tail 50 api
              exit 1
            fi

            if [ "$UI_OK" != "true" ]; then
              echo "UI health check failed! Container logs:"
              docker compose -f docker-compose.prod.yml logs --tail 50 ui
              exit 1
            fi

            echo "=== [5/5] Deployment Complete — Container Status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "Cleaning up stale build layers..."
            docker image prune -f
