name: UI — Install, Build & Start (Cross-Platform)
# Phase 6 / U11: CI that installs, builds, and starts the Next.js UI on
# Linux, macOS, and Windows to catch POSIX-only npm script failures,
# case-sensitivity issues, long-path Windows problems, and engine constraints.

on:
  push:
    branches: [main, develop]
    paths:
      - "zuntenium-ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "zuntenium-ui/**"
      - ".github/workflows/ui.yml"
  schedule:
    # Weekly UI check (Sunday 03:00 UTC) — catches upstream Next.js / Node changes
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  ui-build:
    name: "UI / ${{ matrix.os }} / Node ${{ matrix.node }}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zuntenium-ui

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20"]    # LTS; 18.x support verified by engines field
        include:
          # Also test oldest engines-compatible Node on Linux only (cost control)
          - os: ubuntu-latest
            node: "18"

    steps:
      - uses: actions/checkout@v4

      # Use Node version from .nvmrc if present; fall back to matrix value (U11)
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: zuntenium-ui/package-lock.json

      # Confirm installed versions (evidence for SUPPORT_MATRIX.md)
      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      # clean install — respects lockfile exactly (reproducible)
      - name: Install dependencies
        run: npm ci

      # Next.js build — catches import case errors on Linux (U11)
      - name: Build
        run: npm run build
        env:
          # Avoid process.exit on missing .env at build time
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"

      # Start the dev server briefly and verify it responds on port 3000 (U10)
      - name: Smoke-test dev server start
        shell: bash
        run: |
          npm run dev &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"
          # Wait up to 30 s for port 3000 to become available
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server responded on port 3000 after ${i}s"
              kill $DEV_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "WARNING: Dev server did not respond within 30s — this may be a startup time issue"
          kill $DEV_PID 2>/dev/null || true
          # Non-fatal: mark in summary but do not block CI
          exit 0

      # Lint for case-sensitive import errors (U11 — catches macOS/Windows misses)
      - name: Lint
        run: npm run lint
        continue-on-error: true  # advisory only until lint rules are enforced
