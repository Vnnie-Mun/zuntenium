[metadata]
name = zuntenium
version = attr: zuntenium.version.__version__
description = AI-Native Hybrid Quantum Simulation Framework
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = ZUNTENIUM Project
author_email = dev@zuntenium.io
url = https://zuntenium.io
python_requires = >=3.10

[options]
packages = find:
package_dir = =.
include_package_data = True
zip_safe = False

[options.package_data]
zuntenium =
    py.typed
    bindings/cpp_bindings/*.pyi
    bindings/rust_bindings/*.pyi

[options.extras_require]
dev =
    pytest>=7.4
    pytest-cov>=4.1
    pytest-benchmark>=4.0
    ruff>=0.1
    mypy>=1.7
    pybind11>=2.11
    cmake>=3.27
    pre-commit>=3.5

[options.entry_points]
console_scripts =
    zuntenium = zuntenium.cli:main
