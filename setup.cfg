[metadata]
name = zuntenium
version = attr: zuntenium.version.__version__
description = Enterprise-Grade Hybrid Quantum Computing SDK, Transpiler & Cloud Platform
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = Vnnie-Mun
author_email = vinimun01@gmail.com
url = https://github.com/Vnnie-Mun/zuntenium
python_requires = >=3.10

[options]
packages = find:
package_dir = =.
include_package_data = True
zip_safe = False

[options.packages.find]
where = .
include =
    zuntenium
    zuntenium.*
    zuntenium_cloud
    zuntenium_cloud.*
exclude =
    zuntenium-*
    tests*

[options.package_data]
zuntenium =
    py.typed
    bindings/cpp_bindings/*.pyi
    bindings/rust_bindings/*.pyi

[options.entry_points]
console_scripts =
    zuntenium = zuntenium.cli:main
