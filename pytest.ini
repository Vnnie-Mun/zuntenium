[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
    --strict-markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    benchmark: performance benchmark tests
    asyncio: marks tests as asynchronous
filterwarnings =
    ignore::RuntimeWarning:zuntenium.*
